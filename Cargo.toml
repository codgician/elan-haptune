[package]
name = "elan-haptune"
version = "0.1.0"
edition = "2024"
description = "One-shot settings CLI for a narrowly identified ELAN haptic touchpad"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

